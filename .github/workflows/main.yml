archive="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
test -n "$archive" || { echo "No ZIP archive found"; exit 1; }

mkdir -p project_src
unzip -q -o "$archive" -d project_src

wrapper="$(find project_src -type f -name gradlew -print -quit)"
test -n "$wrapper" || { echo "gradlew not found in the extracted ZIP"; exit 1; }

project_dir="$(dirname "$wrapper")"
chmod +x "$wrapper"
cd "$project_dir"
./gradlew assembleDebug
