name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q "*.zip" -d project_src
          cd project_src
          if [ $(ls -1 | wc -l) -eq 1 ]; then
            shopt -s dotglob
            mv */* . 2>/dev/null || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        working-directory: ./project_src
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./project_src
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_src/app/build/outputs/apk/debug/app-debug.apk
