name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q "*.zip" -d project_src
          cd project_src
          if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
            shopt -s dotglob
            mv */* . 2>/dev/null || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper & Build APK
        working-directory: ./project_src
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project_src/app/build/outputs/apk/debug/app-debug.apk
          
